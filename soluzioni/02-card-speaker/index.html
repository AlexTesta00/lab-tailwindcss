<!DOCTYPE html>
<!--
  Soluzione · Esercizio 02 · La card dello speaker

  max-w-sm ferma la card a 24rem e mx-auto la centra; bordo, raggio e ombra la staccano dallo
  sfondo. Grazie al Preflight l'immagine è già display:block, quindi mx-auto centra anche lei,
  e size-24 fissa larghezza e altezza insieme. Spaziature e colori dei testi sono una delle
  scelte possibili.
-->
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TW Day 2027 · 02 La card dello speaker</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-stone-100 p-10">
  <article class="max-w-sm mx-auto bg-white p-8 text-center border border-stone-200 rounded-2xl shadow-md">
    <img src="avatar.svg" alt="Foto di Giulia Rossi" class="size-24 rounded-full mx-auto">
    <h2 class="mt-4 text-2xl font-bold text-stone-900">Giulia Rossi</h2>
    <p class="text-sm font-semibold uppercase tracking-wide text-teal-700">Speaker · Frontend developer</p>
    <p class="mt-3 text-stone-600">Racconta come ha costruito il sito del suo progetto d'esame scrivendo pochissimo CSS.</p>
    <a href="#" class="inline-block mt-6 px-5 py-2 border-2 border-teal-700 rounded-full text-teal-700 font-semibold">Segui</a>
  </article>
</body>
</html>
