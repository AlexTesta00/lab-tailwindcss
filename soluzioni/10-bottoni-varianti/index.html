<!DOCTYPE html>
<!--
  Soluzione · Esercizio 10 · Bottoni: stati e varianti

  .btn contiene la forma comune, con focus-visible: e disabled:; .btn-primary e .btn-outline
  aggiungono solo colori e hover:. border-2 border-transparent nella base dà a tutti i bottoni
  la stessa altezza. Le varianti si combinano nell'HTML (class="btn btn-primary"), mentre ml-2
  e mt-4 restano utility di posizione.
-->
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TW Day 2027 · 10 Bottoni: stati e varianti</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400..700&family=Instrument+Serif&display=swap">
  <style type="text/tailwindcss">
    @theme {
      --color-brand-50:  #f0fdfa;
      --color-brand-100: #ccfbf1;
      --color-brand-500: #14b8a6;
      --color-brand-700: #0f766e;
      --color-brand-800: #115e59;

      --font-sans: "DM Sans", sans-serif;
      --font-display: "Instrument Serif", serif;
      --text-hero: 4.5rem;
      --radius-card: 1.25rem;
      --shadow-soft: 0 10px 30px rgb(0 0 0 / 0.12);
    }

    @layer components {
      .btn {
        @apply inline-block px-5 py-2.5 rounded-full border-2 border-transparent font-semibold transition
               focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-500
               disabled:opacity-50 disabled:cursor-not-allowed;
      }
      .btn-primary { @apply bg-brand-700 text-white hover:bg-brand-800 active:scale-95; }
      .btn-outline { @apply border-brand-700 text-brand-700 hover:bg-brand-50; }
    }
  </style>
</head>
<body class="bg-stone-100">
  <header class="sticky top-0 flex items-center justify-between bg-white border-b border-stone-200 px-4 md:px-8 py-4">
    <a href="#" class="font-display text-2xl text-brand-700">TW Day</a>
    <nav class="hidden md:flex gap-8 font-medium text-stone-600">
      <a href="#programma">Programma</a>
      <a href="#speaker">Speaker</a>
      <a href="#luogo">Luogo</a>
    </nav>
    <a href="#iscrizione" class="btn btn-primary">Iscriviti</a>
  </header>
  <main>
    <section class="max-w-5xl mx-auto px-4 md:px-8 py-20 text-center md:text-left">
      <p class="text-sm font-semibold uppercase tracking-widest text-brand-700">15 maggio 2027 · Aula Magna</p>
      <h1 class="mt-2 font-display text-4xl md:text-hero text-stone-900">TW Day 2027</h1>
      <p class="mt-2 text-lg text-stone-600">La giornata dei progetti di Tecnologie Web.</p>
      <div class="mt-6">
        <!-- Prova del passo 4: con class="btn btn-primary rounded-lg" il bottone perde la forma a
             pillola. La utility vince sul componente, perché il layer utilities viene dopo components. -->
        <a href="#iscrizione" class="btn btn-primary">Iscriviti</a>
        <a href="#programma" class="btn btn-outline ml-2">Vedi il programma</a>
      </div>
    </section>
    <section id="iscrizione" class="px-4 pb-16">
      <div class="max-w-xl mx-auto bg-white rounded-card shadow-soft p-8">
        <h2 class="font-display text-[28px] text-stone-900">Resta aggiornato</h2>
        <p class="mt-2 max-w-[45ch] text-stone-600">Ti scriviamo solo quando esce il programma completo.</p>
        <form action="#" class="mt-6 flex gap-3">
          <label for="email" class="sr-only">Email</label>
          <input id="email" type="email" placeholder="nome@esempio.it" class="flex-1 border border-stone-300 rounded-lg px-4 py-2 placeholder:text-stone-400 focus:outline-none focus:ring-2 focus:ring-brand-500">
          <button type="submit" class="btn btn-primary">Iscriviti</button>
        </form>
        <button type="button" disabled class="btn btn-primary mt-4">Workshop al completo</button>
      </div>
    </section>
  </main>
</body>
</html>
